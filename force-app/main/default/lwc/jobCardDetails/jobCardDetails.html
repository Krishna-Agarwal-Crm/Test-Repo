<template>
    <template if:true={currentStep}>

        <div class="local-header-container slds-hide_medium">
            <header class="customHeaderClass">
                <div class="slds-grid slds-grid_align-center">
                    <div class="header-text slds-p-vertical_small">
                        New Job Card
                    </div>
                </div>
            </header>
        </div>

        <div class="slds-align-absolute_center"> 
            <c-progress-bar current-step={currentStep}></c-progress-bar>
        </div>

        <lightning-card>
            <template if:true={isStep1}>
                <div>
                    <c-job-identity-page 
                    chassis-no={chassisNo}
                    is-hour-meter ={isHourMeter}
                    running-hours={runningHours}
                    accountid={accountPhone}
                    onidentityupdate={handleIdentityUpdate}></c-job-identity-page>
                </div>
            </template>

            <template if:true={isStep2}>
                <div>
                    <c-job-card-prod-and-cust
                    chassis-no={chassisNo}
                    running-hours={runningHours}
                    tractor-model={tractorModel}
                    fuel-indication={fuelIndication}
                    tyre-pressure={tyrePressure}
                    onback={handleProdAndCustUpdate}
                    ontractordetailsupdate={handleProdAndCustUpdate} ></c-job-card-prod-and-cust>
                </div>
            </template>

            <template if:true={isStep3}>
                <div>
                    <c-service-detail-page
                    onback={handleServiceUpdate}
                    oncancle={handleCancle}
                    onprocced={handleServiceUpdate}></c-service-detail-page>
                </div>
            </template>

        </lightning-card>
    </template>

    <template if:false={currentStep}>
        <div>
            <lightning-button label="New job Card" name="newJobCard" onclick={handleNew} ></lightning-button>
        </div>
    </template>

    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Otp Sent</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <p class="">Otp Sent To</p>
                <lightning-input
                    type="text"
                    variant="label-hidden"
                    value={accountPhone}
                    disabled>
                </lightning-input>
                <lightning-input 
                    type="text" 
                    label="Enter OTP"
                    placeholder="1234" 
                    value={otp}>
                </lightning-input>
            </div>

            <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                <lightning-button 
                    label="Close" 
                    variant="neutral" 
                    onclick={handleClose}>
                </lightning-button>

                <lightning-button
                    label="Save"
                    variant="Brand"
                    onclick={handleSave}>
                </lightning-button>

            </footer>

        </div>
    </section>
    
    <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
